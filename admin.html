<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=dashboard.html">
  <title>Redirecting to Dashboard — WebCare</title>
  <script>
    var isLocalHtml = window.location.protocol === 'file:' || (window.location.hostname === 'localhost' && window.location.pathname.endsWith('.html'));
    var target = isLocalHtml ? 'dashboard.html' : '/dashboard';
    window.location.replace(target + window.location.search + window.location.hash);
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
  <p>Redirecting to <a href="dashboard.html" style="color: #0052ff; font-weight: 600;">WebCare Operations Dashboard</a>...</p>
</body>
</html>
